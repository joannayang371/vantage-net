[project]
name = "vantage-net"
version = "2.4.0"
description = "Vantage inventory, management addressing and billing services"
requires-python = ">=3.10"
dependencies = [
    "unified-inventory-rules @ git+https://github.com/joannayang371/unified-inventory-rules@e38c2fb8029b8bfb67b70dc702c9ccc4bf2b718b#subdirectory=python",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pymongo>=4.6",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
